<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        html { background-color: #FAFAFA; }
        body {
            font-family: Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            color: #212121;
            background-color: #FAFAFA;
            padding: 16px;
            margin: 0;
        }
        h1, h2, h3 { border-bottom: 1px solid #E0E0E0; padding-bottom: 4px; }
        a { color: #1976D2; text-decoration: none; font-weight: 500; }
        ul, ol { padding-left: 20px; }
        li { margin-bottom: 6px; }
        code { background: #EEE; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        blockquote { border-left: 4px solid #1976D2; margin: 0; padding-left: 12px; color: #555; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        th, td { border: 1px solid #DDD; padding: 8px; text-align: left; }
        th { background-color: #F2F2F2; }
        hr { margin: 0; border: none; border-top: 1px solid #E0E0E0; }
        .btn { display: block; width: auto; font-weight: 500; padding: 12px; margin-top: 4px; border-radius: 12px; text-align: center; text-decoration: none; color: black; border: 2px solid #969696; }
        .btn_bus { display: block; width: auto; font-weight: 500; padding: 12px; margin-top: 4px; border-radius: 12px; text-align: center; text-decoration: none; background: blue; color: white; }

        @media (prefers-color-scheme: dark) {
            html { background-color: #121212; }
            body { color: #E0E0E0; background-color: #121212; }
            h1, h2, h3 { border-bottom-color: #3A3A3A; }
            a { color: #8AB4F8; }
            code { background: #2A2A2A; }
            blockquote { border-left-color: #8AB4F8; color: #B0B0B0; }
            th, td { border-color: #444; }
            th { background-color: #232323; }
            hr { border-top-color: #3A3A3A; }
            .btn { color: #F0F0F0; border-color: #6A6A6A; }
            .btn_bus { background: #2F5BD6; color: white; }
        }
    </style>
</head>
<body>
<div id="content">Загрузка...</div>

<script>
    /**
     * Marked v4.3.0 - Встроенная легкая версия библиотеки (оффлайн)
     */
    (function(global) {
        'use strict';
        function marked(src) {
            if (typeof src !== 'string') return '';

            // Заголовки
            src = src.replace(/^### (.*$)/gim, '<h3>$1</h3>')
                     .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                     .replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Горизонтальная линия
            src = src.replace(/^[ \t]*-{3,}[ \t]*$/gm, '<hr>');

            // Неупорядоченные списки (до выделений, чтобы "* пункт" не принимался за курсив)
            src = src.replace(/^[ \t]*[\-\*][ \t]+(.*)$/gm, '<li>$1</li>');
            src = src.replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>');
            src = src.replace(/<\/ul>\s*<ul>/g, '');

            // Выделения (жирный курсив, жирный, курсив)
            src = src.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
                     .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                     .replace(/(^|[^\w])__(.+?)__(?!\w)/g, '$1<strong>$2</strong>')
                     .replace(/\*(.+?)\*/g, '<em>$1</em>');

            // Цитаты
            src = src.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

            // Ссылки
            src = src.replace(/\[([^\[\]]+)\]\(([^\)]+)\)/g, '<a href="$2">$1</a>');

            // Переносы строк
            src = src.replace(/\n\n/gim, '<p></p>').replace(/\n/gim, '<br>');

            return src;
        }

        global.marked = { parse: marked };
    })(this);

    /**
     * Мост взаимодействия с Kotlin/Android
     */
    function renderMarkdownBase64(base64Text) {
        try {
            // Декодирование UTF-8 текста из Base64
            var bytes = atob(base64Text);
            var decodedText = "";
            for (var i = 0; i < bytes.length; i++) {
                decodedText += "%" + ("00" + bytes.charCodeAt(i).toString(16)).slice(-2);
            }
            var markdownText = decodeURIComponent(decodedText);

            // Рендеринг
            document.getElementById('content').innerHTML = marked.parse(markdownText);
        } catch (err) {
            document.getElementById('content').innerHTML = "<p style='color:red;'>Ошибка рендеринга: " + err.message + "</p>";
        }
    }
</script>
</body>
</html>
