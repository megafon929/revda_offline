<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        html { background-color: #FAFAFA; -webkit-text-size-adjust: 100%; }
        body {
            font-family: Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            color: #212121;
            background-color: #FAFAFA;
            padding: 16px;
            margin: 0;
            overflow-wrap: break-word;
        }
        h2, h3 { text-align: center;}
        h1:first-child, h2:first-child, h3:first-child { margin-top: 0; }
        p { margin: 12px 0; }
        a { color: #1976D2; text-decoration: none; font-weight: 500; }
        ul, ol { padding-left: 20px; }
        li { margin-bottom: 6px; }
        code { background: #EEE; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        blockquote { border-left: 4px solid #1976D2; margin: 12px 0; padding-left: 12px; color: #555; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        th, td { border: 1px solid #DDD; padding: 8px; text-align: left; }
        th { background-color: #F2F2F2; }
        hr { margin: 16px 0; border: none; border-top: 1px solid #E0E0E0; }
        .center { text-align: center; }
        .btn, .btn_bus { display: block; font-weight: 500; padding: 12px; margin-top: 4px; border-radius: 12px; text-align: center; text-decoration: none; }
        .btn { color: black; border: 2px solid #969696; }
        .btn_bus { background: blue; color: white; }

        @media (prefers-color-scheme: dark) {
            html { background-color: #121212; }
            body { color: #E0E0E0; background-color: #121212; }
            a { color: #8addf8; }
            code { background: #2A2A2A; }
            blockquote { border-left-color: #8addf8; color: #B0B0B0; }
            th, td { border-color: #444; }
            th { background-color: #232323; }
            hr { border-top-color: #3A3A3A; }
            .btn { color: #F0F0F0; border-color: #6A6A6A; }
            .btn_bus { background: #2F5BD6; color: white; }
        }
    </style>
</head>
<body>
<div id="content">Загрузка...</div>

<script>
    /**
     * Лёгкий офлайн-рендерер markdown (блочный разбор + безопасная обработка инлайна).
     * Строки, начинающиеся с HTML-тега, пропускаются как есть.
     */
    function renderInline(text) {
        // Не трогаем содержимое HTML-тегов (атрибуты href, class и т.д.)
        return text.split(/(<[^>]+>)/).map(function (part) {
            if (part.charAt(0) === '<' && part.charAt(part.length - 1) === '>') return part;
            return part
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\[\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/(^|[^\w])__(.+?)__(?!\w)/g, '$1<strong>$2</strong>')
                .replace(/\*(?=\S)(.+?)\*/g, '<em>$1</em>');
        }).join('');
    }

    function parseMarkdown(src) {
        var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
        var out = [], para = [], list = [];

        function flushPara() {
            if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; }
        }
        function flushList() {
            if (list.length) { out.push('<ul>' + list.join('') + '</ul>'); list = []; }
        }

        lines.forEach(function (raw) {
            var line = raw.replace(/\s+$/, '');
            var m;
            if (!line.trim()) { flushPara(); flushList(); return; }
            if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) {
                flushPara(); flushList();
                out.push('<h' + m[1].length + '>' + renderInline(m[2]) + '</h' + m[1].length + '>');
            } else if (/^\s*-{3,}\s*$/.test(line)) {
                flushPara(); flushList();
                out.push('<hr>');
            } else if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) {
                flushPara();
                list.push('<li>' + renderInline(m[1]) + '</li>');
            } else if ((m = /^>\s?(.*)$/.exec(line))) {
                flushPara(); flushList();
                out.push('<blockquote>' + renderInline(m[1]) + '</blockquote>');
            } else if (/^\s*<\/?(div|p|ul|ol|table|tr|td|th|thead|tbody|h[1-6]|blockquote|hr|center)\b/i.test(line)) {
                // Блочный HTML — пропускаем без обёртки в <p>
                flushPara(); flushList();
                out.push(line.trim());
            } else if (/^\s*<[a-zA-Z\/]/.test(line)) {
                // Строчный HTML (например, кнопки-ссылки)
                flushPara(); flushList();
                out.push('<p>' + renderInline(line.trim()) + '</p>');
            } else {
                flushList();
                para.push(renderInline(line.trim()));
            }
        });
        flushPara(); flushList();
        return out.join('\n');
    }

    /** Вызывается из Kotlin: принимает markdown обычной строкой */
    function renderMarkdown(markdownText) {
        try {
            document.getElementById('content').innerHTML = parseMarkdown(markdownText);
            window.scrollTo(0, 0);
        } catch (err) {
            document.getElementById('content').textContent = 'Ошибка рендеринга: ' + err.message;
        }
    }
</script>
</body>
</html>
